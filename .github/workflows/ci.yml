name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Lets a newer push cancel an in-flight run for the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Lower bound matches the engines field; 24 is the current LTS.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # ci (not install) so the lockfile is the source of truth and a drifting
      # package.json fails here instead of silently at deploy time.
      - run: npm ci

      - run: npm run build
